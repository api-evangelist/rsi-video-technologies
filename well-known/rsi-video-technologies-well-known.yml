generated: '2026-08-17'
method: probed
source: >-
  Live unauthenticated probes of https://videofied.com/, the only host named in
  apis.yml. www.videofied.com and rsivideotech.com do not resolve (NXDOMAIN), so
  there was no second host to probe.
note: >-
  EVERY path returned 404. No WellKnown or SecurityTxt pointer is emitted, because
  nothing here is a served document. videofied.com is not a company site: it is a
  bare redirector app on Azure App Service (TLS certificate is the Azure wildcard
  *.azurewebsites.net, which does not match the hostname) that 301s a handful of
  known marketing paths into Resideo and Honeywell Home, and 404s everything else
  with a 103-byte HTML body. RSI Video Technologies was acquired by Honeywell in
  March 2016 and the Videofied brand now sits with Resideo; there is no RSI-operated
  surface left to probe.
hosts:
