  resolves: true
  address: 23.100.46.198
  platform: Azure App Service (redirector)
  tls_hostname_match: false
  tls_certificate_subject: 'CN=*.azurewebsites.net (Microsoft Corporation)'
  root_behavior: 301 https://videofied.com/ then 200 at https://www.resideo.com/emea/en/solutions/security/residential-security/videofied/
- host: www.videofied.com
  resolves: false
  note: NXDOMAIN - no A record. This is the URL apis.yml carried as the company Website.
- host: rsivideotech.com
  resolves: false
