aid: rsi-video-technologies
name: RSI Video Technologies
description: >-
  RSI Video Technologies was a St. Paul, Minnesota maker of wireless, battery-powered
  intrusion detection devices with built-in cameras, sold worldwide under the Videofied
  brand, together with the Frontel receiver software that delivered alarm events and
  short video clips to professional central monitoring stations. Honeywell acquired the
  company for approximately USD 123 million in March 2016, and the Videofied product
  line moved to Resideo Technologies when Honeywell spun out its Homes business in 2018.
  RSI Video Technologies no longer operates as an independent company: its own domains
  either do not resolve or redirect into Resideo and Honeywell Home marketing pages, and
  it publishes no developer program, documentation or machine-readable API contract of
  its own. Any current developer surface for Videofied hardware belongs to Resideo and is
  profiled separately in the API Evangelist network as resideo-technologies.
